version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sysadmin-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=sqlite:///./app/sqlite.db
      - SECRET_KEY=your-secret-key-change-in-production
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sysadmin-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000/api

  lab:
    build:
      context: ./lab-image
      dockerfile: Dockerfile
    container_name: sysadmin-lab
    ports:
      - "2222:22"
    environment:
      - DEBIAN_FRONTEND=noninteractive
    stdin_open: true
    tty: true

volumes:
  backend_data:
